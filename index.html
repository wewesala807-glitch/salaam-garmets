<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#241F2E;
    --linen:#F6F1E7;
    --brass:#B8873B;
    --teal:#2F6E64;
    --clay:#A2503B;
    --paper:#FFFFFF;
    --line: rgba(36,31,46,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--linen);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  h1,h2,h3{font-family:'Fraunces',serif; font-weight:600; margin:0;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  a{color:inherit;}
  button{font-family:inherit; cursor:pointer;}

  /* ---- NAV ---- */
  header{
    position:sticky; top:0; z-index:40;
    background:var(--ink); color:var(--linen);
    padding:14px 20px;
  }
  .nav-row{
    display:flex; align-items:center; justify-content:space-between;
    max-width:1100px; margin:0 auto; gap:16px;
  }
  .brand{display:flex; align-items:center; gap:10px; text-decoration:none;}
  .brand h1{font-size:1.3rem; color:var(--linen); letter-spacing:0.3px;}
  .brand .dot{width:8px; height:8px; border-radius:50%; background:var(--brass);}
  nav.cats{display:flex; gap:4px; flex-wrap:wrap;}
  nav.cats a{
    font-size:0.82rem; padding:7px 12px; border-radius:20px;
    text-decoration:none; color:var(--linen); opacity:0.78;
    border:1px solid rgba(246,241,231,0.22);
  }
  nav.cats a.active, nav.cats a:hover{opacity:1; background:rgba(246,241,231,0.12);}
  .nav-right{display:flex; align-items:center; gap:14px;}
  .icon-btn{
    background:none; border:none; color:var(--linen); position:relative;
    display:flex; align-items:center; font-size:1.05rem; opacity:0.9;
  }
  .badge{
    position:absolute; top:-8px; right:-10px; background:var(--brass); color:var(--ink);
    font-size:0.65rem; font-weight:700; border-radius:50%; width:17px; height:17px;
    display:flex; align-items:center; justify-content:center;
  }
  .admin-link{font-size:0.7rem; opacity:0.55; text-decoration:none;}
  .admin-link:hover{opacity:0.9;}

  main{max-width:1100px; margin:0 auto; padding:28px 20px 80px;}

  /* ---- HERO ---- */
  .hero{padding:26px 4px 6px;}
  .hero h2{font-size:1.9rem; line-height:1.15;}
  .hero p{margin-top:8px; opacity:0.72; max-width:46ch;}

  /* ---- PRODUCT GRID / TAG CARDS ---- */
  .grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
    gap:18px; margin-top:22px;
  }
  .tag-card{
    background:var(--paper); border-radius:4px; position:relative;
    box-shadow:0 1px 2px rgba(36,31,46,0.08);
    border:1px solid var(--line);
    padding-top:10px; transition:transform .15s ease;
    display:flex; flex-direction:column;
  }
  .tag-card:hover{transform:translateY(-3px);}
  .tag-hole{
    width:12px; height:12px; border-radius:50%; background:var(--linen);
    border:1px solid var(--line); position:absolute; top:-6px; left:16px;
  }
  .tag-card .imgs{display:flex; gap:2px; background:var(--linen);}
  .tag-card .imgs img{flex:1; min-width:0; height:190px; object-fit:contain; background:var(--linen);}
  .tag-card .body{padding:12px 14px 14px; display:flex; flex-direction:column; gap:4px; flex:1;}
  .tag-card .name{
    font-family:'Fraunces',serif; font-weight:600; font-size:1.02rem;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .tag-card .specs{
    font-size:0.76rem; opacity:0.65;
    display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden;
  }
  .tag-card .row-bottom{display:flex; align-items:center; justify-content:space-between; margin-top:auto; padding-top:8px;}
  .price-tag{font-family:'IBM Plex Mono',monospace; font-weight:500; font-size:0.95rem; color:var(--teal);}
  .sold-out{color:var(--clay); font-size:0.72rem; font-weight:600; text-transform:uppercase; letter-spacing:0.4px;}
  .stitch{
    border-top:1px dashed var(--line); margin:0 14px;
  }
  .view-btn{
    background:var(--ink); color:var(--linen); border:none; padding:8px 0;
    font-size:0.78rem; border-radius:3px; margin:10px 14px 14px; letter-spacing:0.3px;
  }

  .empty-state{
    text-align:center; padding:60px 20px; opacity:0.6;
  }

  /* ---- MODAL / DRAWER shared ---- */
  .overlay{
    position:fixed; inset:0; background:rgba(36,31,46,0.5); z-index:60;
    display:none; align-items:center; justify-content:center;
  }
  .overlay.show{display:flex;}
  .sheet{
    background:var(--paper); border-radius:6px; max-width:520px; width:92%;
    max-height:88vh; overflow-y:auto; padding:22px;
  }
  .drawer{
    position:fixed; top:0; right:0; height:100%; width:min(380px,92vw);
    background:var(--paper); z-index:70; transform:translateX(100%);
    transition:transform .25s ease; display:flex; flex-direction:column;
    box-shadow:-4px 0 18px rgba(0,0,0,0.15);
  }
  .drawer.show{transform:translateX(0);}
  .drawer-head{padding:18px 18px 12px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center;}
  .drawer-body{padding:14px 18px; overflow-y:auto; flex:1;}
  .drawer-foot{padding:16px 18px; border-top:1px solid var(--line);}
  .close-x{background:none;border:none;font-size:1.3rem;color:var(--ink); opacity:0.6;}

  .cart-line{display:flex; gap:10px; padding:10px 0; border-bottom:1px solid var(--line);}
  .cart-line img{width:52px; height:52px; object-fit:cover; border-radius:4px; background:#eee;}
  .cart-line .info{flex:1;}
  .cart-line .name{font-weight:600; font-size:0.88rem;}
  .cart-line .meta{font-size:0.72rem; opacity:0.6;}
  .qty-x{font-size:0.72rem; color:var(--clay); background:none; border:none; text-decoration:underline;}

  .btn{
    background:var(--ink); color:var(--linen); border:none; padding:11px 16px;
    border-radius:4px; font-size:0.88rem; font-weight:600; width:100%;
  }
  .btn.brass{background:var(--brass); color:var(--ink);}
  .btn.ghost{background:none; border:1px solid var(--line); color:var(--ink);}
  .btn:disabled{opacity:0.4; cursor:not-allowed;}

  label{display:block; font-size:0.76rem; font-weight:600; margin:12px 0 4px; opacity:0.75;}
  input[type=text],input[type=number],input[type=password],textarea,select{
    width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:4px;
    font-family:inherit; font-size:0.88rem; background:var(--linen);
  }
  textarea{resize:vertical; min-height:60px;}
  .field-row{display:flex; gap:10px;}
  .field-row > div{flex:1;}
  .hint{font-size:0.72rem; opacity:0.55; margin-top:3px;}

  .admin-list-item{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    padding:10px 0; border-bottom:1px solid var(--line);
  }
  .admin-list-item img{width:40px;height:40px;object-fit:cover;border-radius:4px;background:#eee;}
  .tiny-btn{font-size:0.72rem; padding:5px 9px; border-radius:3px; border:1px solid var(--line); background:none;}
  .tiny-btn.danger{color:var(--clay); border-color:var(--clay);}
  .tab-row{display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap;}
  .tab-btn{padding:7px 12px; border-radius:20px; border:1px solid var(--line); background:none; font-size:0.8rem;}
  .tab-btn.active{background:var(--ink); color:var(--linen); border-color:var(--ink);}

  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--linen); padding:10px 18px; border-radius:20px;
    font-size:0.82rem; z-index:100; opacity:0; pointer-events:none; transition:opacity .2s;
  }
  .toast.show{opacity:1;}

  .spec-chip-row{display:flex; flex-wrap:wrap; gap:6px; margin-top:6px;}
  .spec-chip{background:var(--linen); border:1px solid var(--line); border-radius:20px; padding:5px 10px; font-size:0.72rem;}

  @media (max-width:640px){

  header{padding:10px 12px;}
  .nav-row{gap:8px;}
  .brand h1{font-size:1rem;}
  .icon-btn{font-size:.9rem;}
  nav.cats{display:none;}
  main{padding:16px 10px 60px;}
  .hero{padding:14px 0 6px;}
  .hero h2{font-size:1.35rem;line-height:1.2;}
  .hero p{font-size:.82rem;}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}
  .tag-card{width:100%;min-width:0;}
  .tag-card .imgs{gap:1px;}
  .tag-card .imgs img{height:115px;width:100%;object-fit:contain;}
  .tag-card .body{padding:8px;gap:3px;}
  .tag-card .name{font-size:.82rem;line-height:1.2;}
  .tag-card .specs{font-size:.68rem;}
  .price-tag{font-size:.8rem;}
  .sold-out{font-size:.62rem;}
  .view-btn{margin:8px;font-size:.72rem;padding:7px 0;}
  .sheet{width:96%;padding:16px;}
  .drawer{width:100%;}
  .field-row{flex-direction:column;gap:8px;}
}
</style>
</head>
<body>

<header>
  <div class="nav-row">
    <a href="#/" class="brand"><span class="dot"></span><h1 id="brand-name">Shop</h1></a>
    <nav class="cats" id="cat-nav"></nav>
    <div class="nav-right">
      <button class="icon-btn" onclick="openCart()">Cart<span class="badge" id="cart-badge" style="display:none;">0</span></button>
      <a href="#/admin" class="admin-link">admin</a>
    </div>
  </div>
</header>

<main id="main">
  <div class="empty-state">Loading…</div>
</main>

<!-- CART DRAWER -->
<div class="overlay" id="cart-overlay" onclick="if(event.target===this) closeCart()">
  <div class="drawer" id="cart-drawer">
    <div class="drawer-head"><h3>Your cart</h3><button class="close-x" onclick="closeCart()">×</button></div>
    <div class="drawer-body" id="cart-body"></div>
    <div class="drawer-foot">
      <div style="display:flex; justify-content:space-between; margin-bottom:10px; font-weight:600;">
        <span>Total</span><span class="mono" id="cart-total"></span>
      </div>
      <button class="btn brass" id="checkout-btn" onclick="checkoutWhatsapp()">Order via WhatsApp</button>
    </div>
  </div>
</div>

<!-- PRODUCT MODAL -->
<div class="overlay" id="product-overlay" onclick="if(event.target===this) closeProduct()">
  <div class="sheet" id="product-sheet"></div>
</div>

<!-- ADMIN PIN MODAL -->
<div class="overlay" id="pin-overlay">
  <div class="sheet" style="max-width:320px;">
    <h3>Admin sign-in</h3>
    <label>PIN</label>
    <input type="password" id="pin-input" placeholder="Enter PIN">
    <div class="hint" id="pin-err" style="color:var(--clay);"></div>
    <button class="btn" style="margin-top:14px;" onclick="submitPin()">Enter</button>
    <button class="btn ghost" style="margin-top:8px;" onclick="location.hash='#/'">Cancel</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ---------------- STATE ---------------- */
// This is the Worker URL from `wrangler deploy` — edit this line if you ever redeploy elsewhere.
const API_BASE = "https://shop-images.okulloz-shop.workers.dev";

let categories = [];
let products = [];
let config = { businessName:"Your Shop", whatsapp:"256700000000", currency:"UGX", pin:"1234" };
let cart = [];
let isAdmin = false;
let dataReady = false;
let uploadSecret = "";

const DEFAULT_CATEGORIES = [
  { id:"kanzus", name:"Kanzus", specFields:["Size","Color"] },
  { id:"hijabs-abayas", name:"Hijabs & Abayas", specFields:["Size","Color"] },
  { id:"capes", name:"Capes", specFields:["Size","Color"] }
];
const DEFAULT_PRODUCTS = [
  { id:"sample-1", categoryId:"kanzus", name:"Sample Kanzu (edit or delete me)", price:45000,
    images:["https://placehold.co/500x600/F6F1E7/241F2E?text=Add+a+photo"], specs:{Size:"L",Color:"White"},
    stock:1, description:"This is a sample listing. Go to Admin to edit or remove it, and add your real items." }
];

function slugify(s){ return s.toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"") || ("id-"+Date.now()); }
function money(n){ return config.currency + " " + Number(n||0).toLocaleString(); }
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2200);
}

/* ---------------- STORAGE ----------------
   Shared shop data (products/categories/config) lives on the Worker/R2 so every
   visitor sees the same catalog. Personal, device-only data (cart, admin secret)
   lives in this browser's localStorage. */

async function fetchData(key, fallback){
  try{
    const res = await fetch(`${API_BASE}/data/${key}`);
    if(!res.ok) throw new Error("fetch failed " + res.status);
    const val = await res.json();
    return val === null ? fallback : val;
  }catch(e){
    console.error("load error for", key, e);
    return fallback;
  }
}
async function putData(key, value, toast){
  try{
    const res = await fetch(`${API_BASE}/data/${key}`, {
      method:"PUT",
      headers:{ "Authorization": `Bearer ${uploadSecret}`, "Content-Type":"application/json" },
      body: JSON.stringify(value)
    });
    if(!res.ok) throw new Error("save failed " + res.status);
  }catch(e){
    console.error("save error for", key, e);
    if(toast) showToast("Could not save — check your connection or upload secret");
  }
}

async function loadAll(){
  categories = await fetchData("categories", DEFAULT_CATEGORIES);
  products   = await fetchData("products", DEFAULT_PRODUCTS);
  config     = await fetchData("config", config);
  if(!categories || categories.length===0) categories = DEFAULT_CATEGORIES;
  if(!products) products = [];
  dataReady = true;
}
async function saveCategories(toast){ await putData("categories", categories, toast); }
async function saveProducts(toast){ await putData("products", products, toast); }
async function saveConfig(toast){ await putData("config", config, toast); }

function loadCart(){
  try{ cart = JSON.parse(localStorage.getItem("shop-cart") || "[]"); }catch(e){ cart = []; }
  updateCartBadge();
}
function saveCart(){
  try{ localStorage.setItem("shop-cart", JSON.stringify(cart)); }catch(e){ console.error(e); }
  updateCartBadge();
}
function loadUploadSecret(){
  uploadSecret = localStorage.getItem("shop-upload-secret") || "";
}
function saveUploadSecret(val){
  uploadSecret = val;
  try{ localStorage.setItem("shop-upload-secret", val); }catch(e){ console.error(e); }
}

/* ---------------- ROUTER ---------------- */
window.addEventListener("hashchange", render);
window.addEventListener("DOMContentLoaded", init);

async function init(){
  await loadAll();
  await loadCart();
  await loadUploadSecret();
  document.getElementById("brand-name").textContent = config.businessName;
  render();
}

function currentRoute(){
  const h = location.hash.replace(/^#\/?/,"");
  return h.split("/").filter(Boolean);
}

function render(){
  if(!dataReady) return;
  document.getElementById("brand-name").textContent = config.businessName;
  renderCatNav();
  const route = currentRoute();
  document.getElementById("pin-overlay").classList.remove("show");

  if(route[0]==="admin"){
    if(!isAdmin){ document.getElementById("pin-overlay").classList.add("show"); renderAdminShell(true); return; }
    renderAdmin();
    return;
  }
  if(route[0]==="category" && route[1]){
    renderCatalog(route[1]);
    return;
  }
  renderCatalog(null);
}

function renderCatNav(){
  const nav = document.getElementById("cat-nav");
  const route = currentRoute();
  const activeCat = route[0]==="category" ? route[1] : null;
  nav.innerHTML = `<a href="#/" class="${!activeCat && route[0]!=='admin' ? 'active':''}">All</a>` +
    categories.map(c => `<a href="#/category/${c.id}" class="${activeCat===c.id?'active':''}">${escapeHtml(c.name)}</a>`).join("");
}

/* ---------------- CATALOG ---------------- */
function renderCatalog(catId){
  const main = document.getElementById("main");
  const list = catId ? products.filter(p=>p.categoryId===catId) : products;
  const cat = categories.find(c=>c.id===catId);

  let html = `<div class="hero">
      <h2>${cat ? escapeHtml(cat.name) : escapeHtml(config.businessName)}</h2>
      <p>${cat ? "Browse this category and tap a piece to see details." : "Tap any piece for details, add it to your cart, then send your order straight to WhatsApp."}</p>
    </div>`;

  if(list.length===0){
    html += `<div class="empty-state">Nothing listed here yet — check back soon.</div>`;
  } else {
    html += `<div class="grid">` + list.map(p=>{
      const specs = Object.entries(p.specs||{}).filter(([k,v])=>v).map(([k,v])=>`${k}: ${escapeHtml(String(v))}`).join(" · ");
      const out = (p.stock||0) <= 0;
      const imgs = (p.images && p.images.length) ? p.images : ['https://placehold.co/500x600?text=No+photo'];
      const shown = imgs.length>1 ? imgs.slice(0,2) : [imgs[0]];
      return `<div class="tag-card" onclick="openProduct('${p.id}')">
        <div class="tag-hole"></div>
        <div class="imgs">${shown.map(im=>`<img src="${escapeAttr(im)}" alt="${escapeAttr(p.name)}">`).join("")}</div>
        <div class="body">
          <div class="name">${escapeHtml(p.name)}</div>
          <div class="specs">${specs}</div>
          <div class="row-bottom">
            <span class="price-tag">${money(p.price)}</span>
            ${out ? '<span class="sold-out">Sold</span>' : ''}
          </div>
        </div>
      </div>`;
    }).join("") + `</div>`;
  }
  main.innerHTML = html;
}

/* ---------------- PRODUCT MODAL ---------------- */
let activeProduct = null;
let modalImgIndex = 0;
let modalQty = 1;

function openProduct(id){
  activeProduct = products.find(p=>p.id===id);
  if(!activeProduct) return;
  modalImgIndex = 0; modalQty = 1;
  renderProductModal();
  document.getElementById("product-overlay").classList.add("show");
}
function closeProduct(){ document.getElementById("product-overlay").classList.remove("show"); activeProduct=null; }

function renderProductModal(){
  const p = activeProduct;
  const images = (p.images && p.images.length) ? p.images : ["https://placehold.co/500x600?text=No+photo"];
  const cat = categories.find(c=>c.id===p.categoryId);
  const out = (p.stock||0) <= 0;
  const specsHtml = Object.entries(p.specs||{}).filter(([k,v])=>v)
    .map(([k,v])=>`<span class="spec-chip">${escapeHtml(k)}: ${escapeHtml(String(v))}</span>`).join("");

  document.getElementById("product-sheet").innerHTML = `
    <img src="${escapeAttr(images[modalImgIndex])}" style="width:100%; height:300px; object-fit:cover; border-radius:4px;">
    ${images.length>1 ? `<div style="display:flex; gap:6px; margin-top:8px;">` +
      images.map((im,i)=>`<img src="${escapeAttr(im)}" onclick="modalImgIndex=${i}; renderProductModal();"
        style="width:50px;height:50px;object-fit:cover;border-radius:3px;cursor:pointer;opacity:${i===modalImgIndex?1:0.5};">`).join("") + `</div>` : ""}
    <h3 style="margin-top:14px;">${escapeHtml(p.name)}</h3>
    <div style="opacity:0.6; font-size:0.78rem;">${cat ? escapeHtml(cat.name) : ""}</div>
    <div class="spec-chip-row">${specsHtml}</div>
    <p style="font-size:0.88rem; margin-top:10px; opacity:0.8;">${escapeHtml(p.description||"")}</p>
    <div class="price-tag" style="font-size:1.2rem; margin-top:10px;">${money(p.price)}</div>
    ${out ? `<div class="sold-out" style="margin-top:10px;">This piece has been sold</div>` : `
      <div class="field-row" style="margin-top:14px; align-items:end;">
        <div>
          <label style="margin-top:0;">Quantity</label>
          <input type="number" min="1" max="${p.stock||1}" value="${modalQty}" id="modal-qty"
            onchange="modalQty = Math.max(1, Math.min(${p.stock||1}, Number(this.value)||1)); this.value=modalQty;">
        </div>
      </div>
      <div class="hint">${p.stock||1} available</div>
      <button class="btn brass" style="margin-top:14px;" onclick="addToCart()">Add to cart</button>
    `}
  `;
}

async function addToCart(){
  const p = activeProduct;
  const qtyInput = document.getElementById("modal-qty");
  const qty = qtyInput ? Math.max(1, Math.min(p.stock||1, Number(qtyInput.value)||1)) : 1;
  const specs = Object.entries(p.specs||{}).filter(([k,v])=>v).map(([k,v])=>`${k}: ${v}`).join(", ");
  const existing = cart.find(l=>l.productId===p.id);
  if(existing){ existing.qty = Math.min(p.stock||1, existing.qty+qty); }
  else{ cart.push({ productId:p.id, name:p.name, price:p.price, image:(p.images&&p.images[0])||"", specs, qty }); }
  await saveCart();
  showToast("Added to cart");
  closeProduct();
}

/* ---------------- CART ---------------- */
function updateCartBadge(){
  const count = cart.reduce((s,l)=>s+l.qty,0);
  const badge = document.getElementById("cart-badge");
  badge.textContent = count;
  badge.style.display = count>0 ? "flex" : "none";
}
function openCart(){
  renderCart();
  document.getElementById("cart-overlay").classList.add("show");
  document.getElementById("cart-drawer").classList.add("show");
}
function closeCart(){
  document.getElementById("cart-overlay").classList.remove("show");
  document.getElementById("cart-drawer").classList.remove("show");
}

function renderCart(){
  const body = document.getElementById("cart-body");
  if(cart.length===0){
    body.innerHTML = `<div class="empty-state">Your cart is empty.</div>`;
  } else {
    body.innerHTML = cart.map((l,i)=>`
      <div class="cart-line">
        <img src="${escapeAttr(l.image||'https://placehold.co/100')}">
        <div class="info">
          <div class="name">${escapeHtml(l.name)}</div>
          <div class="meta">${escapeHtml(l.specs||"")} · Qty ${l.qty} · ${money(l.price*l.qty)}</div>
          <button class="qty-x" onclick="removeCartLine(${i})">Remove</button>
        </div>
      </div>`).join("");
  }
  const total = cart.reduce((s,l)=>s+l.price*l.qty,0);
  document.getElementById("cart-total").textContent = money(total);
  document.getElementById("checkout-btn").disabled = cart.length===0;
}
async function removeCartLine(i){ cart.splice(i,1); await saveCart(); renderCart(); }

function checkoutWhatsapp(){
  if(cart.length===0) return;
  let msg = `Hi ${config.businessName}, I'd like to order:\n\n`;
  cart.forEach(l=>{
    msg += `• ${l.name}${l.specs ? " ("+l.specs+")" : ""} x${l.qty} — ${money(l.price*l.qty)}\n`;
  });
  const total = cart.reduce((s,l)=>s+l.price*l.qty,0);
  msg += `\nTotal: ${money(total)}`;
  const url = `https://wa.me/${config.whatsapp.replace(/[^0-9]/g,"")}?text=${encodeURIComponent(msg)}`;
  window.open(url, "_blank");
}

/* ---------------- ADMIN AUTH ---------------- */
function submitPin(){
  const val = document.getElementById("pin-input").value;
  if(val === config.pin){
    isAdmin = true;
    document.getElementById("pin-overlay").classList.remove("show");

/* ---------------- ADMIN PANEL ---------------- */
let adminTab = "products";
function renderAdminShell(pinOnly){
  if(pinOnly){ document.getElementById("main").innerHTML = `<div class="empty-state">Sign in to manage your shop.</div>`; }
}

function renderAdmin(){
  const main = document.getElementById("main");
  main.innerHTML = `
    <div class="hero"><h2>Admin</h2><p>Only visible to you. Add products, manage categories, and update your shop settings.</p></div>
    <div class="tab-row">
      <button class="tab-btn ${adminTab==='products'?'active':''}" onclick="adminTab='products'; renderAdmin();">Products</button>
      <button class="tab-btn ${adminTab==='categories'?'active':''}" onclick="adminTab='categories'; renderAdmin();">Categories</button>
      <button class="tab-btn ${adminTab==='settings'?'active':''}" onclick="adminTab='settings'; renderAdmin();">Settings</button>
    </div>
    <div id="admin-content"></div>
  `;
  if(adminTab==="products") renderAdminProducts();
  if(adminTab==="categories") renderAdminCategories();
  if(adminTab==="settings") renderAdminSettings();
}

/* ---- Admin: Products ---- */
function renderAdminProducts(){
  const el = document.getElementById("admin-content");
  el.innerHTML = `
    <button class="btn brass" style="margin-bottom:16px;" onclick="openProductForm(null)">+ Add product</button>
    ${products.map(p=>{
      const cat = categories.find(c=>c.id===p.categoryId);
      return `<div class="admin-list-item">
        <img src="${escapeAttr((p.images&&p.images[0])||'https://placehold.co/100')}">
        <div style="flex:1;">
          <div style="font-weight:600; font-size:0.88rem;">${escapeHtml(p.name)}</div>
          <div class="hint">${cat?escapeHtml(cat.name):""} · ${money(p.price)} · stock ${p.stock||0}</div>
        </div>
        <button class="tiny-btn" onclick="openProductForm('${p.id}')">Edit</button>
        <button class="tiny-btn danger" onclick="deleteProduct('${p.id}')">Delete</button>
      </div>`;
    }).join("") || `<div class="empty-state">No products yet.</div>`}
  `;
}

function openProductForm(id){
  const p = id ? products.find(x=>x.id===id) : { id:null, categoryId:categories[0]?.id||"", name:"", price:"", images:[""], specs:{}, stock:1, description:"" };
  const cat = categories.find(c=>c.id===p.categoryId) || categories[0];
  const specFields = cat ? cat.specFields : [];
  document.getElementById("product-sheet").innerHTML = `
    <h3>${id ? "Edit product" : "Add product"}</h3>
    <label>Category</label>
    <select id="pf-cat" onchange="onProductCatChange()">
      ${categories.map(c=>`<option value="${c.id}" ${c.id===p.categoryId?"selected":""}>${escapeHtml(c.name)}</option>`).join("")}
    </select>
    <label>Name</label>
    <input type="text" id="pf-name" value="${escapeAttr(p.name)}" placeholder="e.g. White embroidered kanzu">
    <div class="field-row">
      <div><label>Price (${config.currency})</label><input type="number" id="pf-price" value="${p.price}"></div>
      <div><label>Stock / quantity</label><input type="number" id="pf-stock" value="${p.stock||1}" min="0"></div>
    </div>
    <label>Upload photos</label>
    <input type="file" id="pf-file" accept="image/*" multiple onchange="handlePhotoUpload(this)">
    <div class="hint" id="pf-upload-status"></div>
    <label>Photo URLs (one per line)</label>
    <textarea id="pf-images" placeholder="https://...">${(p.images||[]).join("\n")}</textarea>
    <div class="hint">Uploaded photos are added here automatically — you can also paste links directly.</div>
    <div id="pf-specs"></div>
    <label>Description</label>
    <textarea id="pf-desc">${escapeHtml(p.description||"")}</textarea>
    <button class="btn" style="margin-top:16px;" onclick="saveProductForm('${p.id||""}')">Save</button>
    <button class="btn ghost" style="margin-top:8px;" onclick="closeProduct()">Cancel</button>
  `;
  window.__pfSpecs = p.specs || {};
  renderProductSpecFields(specFields);
  document.getElementById("product-overlay").classList.add("show");
}
async function handlePhotoUpload(input){
  const status = document.getElementById("pf-upload-status");
  const files = Array.from(input.files || []);
  if(files.length===0) return;
  if(!uploadSecret){ status.textContent = "Add your upload secret in Admin → Settings first."; status.style.color = "var(--clay)"; return; }

  const textarea = document.getElementById("pf-images");
  for(let i=0; i<files.length; i++){
    const file = files[i];
    status.textContent = `Uploading ${i+1} of ${files.length}…`;
    status.style.color = "";
    try{
      const res = await fetch(API_BASE + "/upload", {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${uploadSecret}`,
          "Content-Type": file.type || "application/octet-stream",
          "X-Filename": file.name
        },
        body: file
      });
      if(!res.ok){ throw new Error("Upload failed (" + res.status + ")"); }
      const data = await res.json();
      const existing = textarea.value.split("\n").map(s=>s.trim()).filter(Boolean);
      existing.push(data.url);
      textarea.value = existing.join("\n");
    }catch(e){
      console.error(e);
      status.textContent = "Upload failed — check your endpoint and secret.";
      status.style.color = "var(--clay)";
      return;
    }
  }
  status.textContent = `Uploaded ${files.length} photo${files.length>1?"s":""}.`;
  input.value = "";
}

function onProductCatChange(){
  const catId = document.getElementById("pf-cat").value;
  const cat = categories.find(c=>c.id===catId);
  renderProductSpecFields(cat ? cat.specFields : []);
}
function renderProductSpecFields(fields){
  const wrap = document.getElementById("pf-specs");
  wrap.innerHTML = fields.map(f=>`
    <label>${escapeHtml(f)}</label>
    <input type="text" data-spec="${escapeAttr(f)}" value="${escapeAttr(window.__pfSpecs[f]||"")}">
  `).join("");
}
async function saveProductForm(id){
  const catId = document.getElementById("pf-cat").value;
  const name = document.getElementById("pf-name").value.trim();
  const price = Number(document.getElementById("pf-price").value)||0;
  const stock = Number(document.getElementById("pf-stock").value)||0;
  const images = document.getElementById("pf-images").value.split("\n").map(s=>s.trim()).filter(Boolean);
  const desc = document.getElementById("pf-desc").value;
  if(!name){ showToast("Please add a product name"); return; }
  const specs = {};
  document.querySelectorAll("[data-spec]").forEach(inp=>{ specs[inp.dataset.spec] = inp.value; });

  if(id){
    const p = products.find(x=>x.id===id);
    Object.assign(p, { categoryId:catId, name, price, images, stock, specs, description:desc });
  } else {
    products.push({ id: slugify(name)+"-"+Date.now().toString(36), categoryId:catId, name, price, images, stock, specs, description:desc });
  }
  await saveProducts(true);
  closeProduct();
  showToast("Saved");
  renderAdmin();
}
async function deleteProduct(id){
  if(!confirm("Delete this product?")) return;
  products = products.filter(p=>p.id!==id);
  await saveProducts(true);
  renderAdmin();
}

/* ---- Admin: Categories ---- */
function renderAdminCategories(){
  const el = document.getElementById("admin-content");
  el.innerHTML = `
    <button class="btn brass" style="margin-bottom:16px;" onclick="openCategoryForm(null)">+ Add category</button>
    ${categories.map(c=>`
      <div class="admin-list-item">
        <div style="flex:1;">
          <div style="font-weight:600; font-size:0.88rem;">${escapeHtml(c.name)}</div>
          <div class="hint">Fields: ${(c.specFields||[]).join(", ")||"none"}</div>
        </div>
        <button class="tiny-btn" onclick="openCategoryForm('${c.id}')">Edit</button>
        <button class="tiny-btn danger" onclick="deleteCategory('${c.id}')">Delete</button>
      </div>
    `).join("")}
  `;
}
function openCategoryForm(id){
  const c = id ? categories.find(x=>x.id===id) : { id:null, name:"", specFields:[] };
  document.getElementById("product-sheet").innerHTML = `
    <h3>${id?"Edit category":"Add category"}</h3>
    <label>Category name</label>
    <input type="text" id="cf-name" value="${escapeAttr(c.name)}" placeholder="e.g. Perfumes">
    <label>Custom fields for this category</label>
    <input type="text" id="cf-fields" value="${escapeAttr((c.specFields||[]).join(", "))}" placeholder="e.g. Size, Volume, Scent">
    <div class="hint">Comma-separated. These become fillable fields on every product in this category.</div>
    <button class="btn" style="margin-top:16px;" onclick="saveCategoryForm('${c.id||""}')">Save</button>
    <button class="btn ghost" style="margin-top:8px;" onclick="closeProduct()">Cancel</button>
  `;
  document.getElementById("product-overlay").classList.add("show");
}
async function saveCategoryForm(id){
  const name = document.getElementById("cf-name").value.trim();
  const fields = document.getElementById("cf-fields").value.split(",").map(s=>s.trim()).filter(Boolean);
  if(!name){ showToast("Please add a category name"); return; }
  if(id){
    const c = categories.find(x=>x.id===id);
    c.name = name; c.specFields = fields;
  } else {
    categories.push({ id: slugify(name), name, specFields: fields });
  }
  await saveCategories(true);
  closeProduct();
  showToast("Saved");
  renderAdmin();
  renderCatNav();
}
async function deleteCategory(id){
  const inUse = products.some(p=>p.categoryId===id);
  if(inUse){ showToast("Move or delete that category's products first"); return; }
  if(!confirm("Delete this category?")) return;
  categories = categories.filter(c=>c.id!==id);
  await saveCategories(true);
  renderAdmin();
  renderCatNav();
}

/* ---- Admin: Settings ---- */
function renderAdminSettings(){
  const el = document.getElementById("admin-content");
  el.innerHTML = `
    <label>Shop name</label>
    <input type="text" id="cfg-name" value="${escapeAttr(config.businessName)}">
    <label>WhatsApp number (with country code, digits only)</label>
    <input type="text" id="cfg-wa" value="${escapeAttr(config.whatsapp)}" placeholder="e.g. 256700000000">
    <label>Currency label</label>
    <input type="text" id="cfg-cur" value="${escapeAttr(config.currency)}">
    <label>Admin PIN</label>
    <input type="text" id="cfg-pin" value="${escapeAttr(config.pin)}">
    <div class="hint">This PIN is a light deterrent, not real security — anyone with browser dev tools could bypass it. Don't store anything sensitive here.</div>

    <label style="margin-top:22px;">Upload secret</label>
    <input type="password" id="cfg-secret" value="${escapeAttr(uploadSecret)}" placeholder="Paste the secret you set with wrangler secret put UPLOAD_SECRET">
    <div class="hint">This must match the UPLOAD_SECRET on your Worker, or saving products/photos will fail. Kept only on this device — you'll re-enter it if you manage the shop from another phone/computer. Connected to: <span class="mono">${escapeHtml(API_BASE)}</span></div>

    <button class="btn" style="margin-top:16px;" onclick="saveSettings()">Save settings</button>
  `;
}
async function saveSettings(){
  config.businessName = document.getElementById("cfg-name").value.trim() || config.businessName;
  config.whatsapp = document.getElementById("cfg-wa").value.trim();
  config.currency = document.getElementById("cfg-cur").value.trim() || "UGX";
  config.pin = document.getElementById("cfg-pin").value.trim() || config.pin;
  saveUploadSecret(document.getElementById("cfg-secret").value.trim());
  await saveConfig(true);
  document.getElementById("brand-name").textContent = config.businessName;
  showToast("Settings saved");
}

/* ---------------- utils ---------------- */
function escapeHtml(s){ return String(s??"").replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
function escapeAttr(s){ return escapeHtml(s); }
</script>
